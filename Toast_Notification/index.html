<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Toasts</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-10 bg-gray-50">
  <div class="space-x-2" >
    <button data-toast="success" class="toast-button px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">Success</button>
    <button data-toast="error" class="toast-button px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600">Error</button>
    <button data-toast="warning" class="toast-button px-4 py-2 bg-yellow-500 text-white rounded hover:bg-yellow-600">Warning</button>
  </div>
  <div id="toast-container" class="fixed bottom-5 right-5 flex flex-col gap-3 z-50"></div>
  <script src="script.js"></script>
</body>
</html>
